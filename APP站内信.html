<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>消息中心</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: #f5f6f9;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #333333;
    -webkit-font-smoothing: antialiased;
  }

  .page-container {
    width: 100%;
    max-width: 414px;
    margin: 0 auto;
    background: #f5f6f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* 视图切换：列表页 vs 详情页 */
  .view {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 0;
    left: 0;
    background: #f5f6f9;
    transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  }

  #list-view {
    transform: translateX(0);
    z-index: 1;
  }

  #detail-view {
    transform: translateX(100%);
    z-index: 2;
  }

  /* 当进入详情页时的平移类 */
  .page-container.show-detail #list-view {
    transform: translateX(-30%);
  }
  .page-container.show-detail #detail-view {
    transform: translateX(0);
  }

  /* 导航栏 */
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border-bottom: 0.5px solid #eaeaea;
    flex-shrink: 0;
  }

  .nav-back {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .nav-title {
    font-size: 17px;
    font-weight: 600;
    color: #111;
  }

  .nav-action {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: #e60012;
    font-weight: 500;
    cursor: pointer;
  }

  .content {
    flex: 1;
    padding: 12px 14px 24px 14px;
    overflow-y: auto;
  }

  /* 客服卡片 */
  .service-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    margin-bottom: 16px;
  }

  .service-icon {
    width: 38px;
    height: 38px;
    background: #fff0f0;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .service-text {
    flex: 1;
    min-width: 0;
  }

  .service-title {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 2px;
  }

  .service-desc {
    font-size: 12px;
    color: #8c8c8c;
    line-height: 1.3;
  }

  /* 业务类型列表 */
  .group-list {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    overflow: hidden;
  }

  .group-item {
    display: flex;
    align-items: center;
    padding: 14px;
    position: relative;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .group-item:active {
    background-color: #f9f9f9;
  }

  .group-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 62px;
    right: 0;
    bottom: 0;
    height: 0.5px;
    background-color: #f0f0f0;
  }

  .icon-box {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-right: 12px;
  }

  .bg-monitor { background: #e6f7ff; color: #1890ff; }
  .bg-service { background: #fff7e6; color: #fa8c16; }
  .bg-business { background: #f6ffed; color: #52c41a; }
  .bg-feedback { background: #fff0f0; color: #e60012; }

  .group-info {
    flex: 1;
    min-width: 0;
  }

  .group-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .type-name {
    font-size: 15px;
    font-weight: 600;
    color: #1f1f1f;
  }

  .last-time {
    font-size: 11px;
    color: #bfbfbf;
  }

  .group-sub-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .summary-text {
    font-size: 13px;
    color: #666666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 12px;
  }

  .unread-badge {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    background-color: #e60012;
    color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* 消息详情页专属样式 */
  .time-divider {
    text-align: center;
    margin: 16px 0 12px 0;
  }

  .time-divider span {
    font-size: 12px;
    color: #8c8c8c;
    background: #e8eaee;
    padding: 3px 10px;
    border-radius: 10px;
    display: inline-block;
  }

  .detail-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
  }

  .detail-card-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 8px;
  }

  .detail-card-body {
    font-size: 13px;
    color: #555555;
    line-height: 1.5;
    margin-bottom: 12px;
    word-break: break-all;
  }

  .detail-card-link {
    border-top: 0.5px solid #f0f0f0;
    padding-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #1890ff;
    font-weight: 500;
    cursor: pointer;
  }

  .arrow-icon {
    width: 12px;
    height: 12px;
    stroke: #1890ff;
  }
</style>
</head>
<body>

<div class="page-container" id="app">

  <!-- 1. 消息列表页（按业务类型） -->
  <div class="view" id="list-view">
    <div class="nav-bar">
      <div class="nav-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </div>
      <div class="nav-title">消息中心</div>
      <div class="nav-action">全部已读</div>
    </div>

    <div class="content">
      <!-- 人工客服 -->
      <div class="service-card">
        <div class="service-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e60012" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
        </div>
        <div class="service-text">
          <div class="service-title">人工客服</div>
          <div class="service-desc">如果您遇到了问题或困难，我们将竭诚为您解答。</div>
        </div>
      </div>

      <div class="group-list">
        <!-- 设备监控与管理 -->
        <div class="group-item" onclick="openDetail('设备监控与管理')">
          <div class="icon-box bg-monitor">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </div>
          <div class="group-info">
            <div class="group-top-row">
              <span class="type-name">设备监控与管理</span>
              <span class="last-time">14:20</span>
            </div>
            <div class="group-sub-row">
              <span class="summary-text">围栏告警、设备绑定消息提醒</span>
              <span class="unread-badge">4</span>
            </div>
          </div>
        </div>

        <!-- 服务与售后 -->
        <div class="group-item" onclick="openDetail('服务与售后')">
          <div class="icon-box bg-service">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
          </div>
          <div class="group-info">
            <div class="group-top-row">
              <span class="type-name">服务与售后</span>
              <span class="last-time">09:30</span>
            </div>
            <div class="group-sub-row">
              <span class="summary-text">保养提醒、服务召请</span>
              <span class="unread-badge">3</span>
            </div>
          </div>
        </div>

        <!-- 商务与报价 -->
        <div class="group-item" onclick="openDetail('商务与报价')">
          <div class="icon-box bg-business">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
          </div>
          <div class="group-info">
            <div class="group-top-row">
              <span class="type-name">商务与报价</span>
              <span class="last-time">08-09 11:00</span>
            </div>
            <div class="group-sub-row">
              <span class="summary-text">服务工单、配件报价</span>
              <span class="unread-badge">2</span>
            </div>
          </div>
        </div>

        <!-- 客户反馈与评价 -->
        <div class="group-item" onclick="openDetail('客户反馈与评价')">
          <div class="icon-box bg-feedback">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div class="group-info">
            <div class="group-top-row">
              <span class="type-name">客户反馈与评价</span>
              <span class="last-time">08-10 15:00</span>
            </div>
            <div class="group-sub-row">
              <span class="summary-text">投诉、满意度回访</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 消息内容详情页 -->
  <div class="view" id="detail-view">
    <div class="nav-bar">
      <div class="nav-back" onclick="closeDetail()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </div>
      <div class="nav-title" id="detail-nav-title">消息详情</div>
    </div>

    <div class="content" id="detail-content">
      <!-- 动态填充点击后的消息列表 -->
    </div>
  </div>

</div>

<script>
  // 模拟当前时间：2026年8月11日 16:00
  // 详情页时间分割规则：
  // 1. 当前（今天）：直接显示 小时:分钟 -> "14:20"
  // 2. 昨天：昨天 小时:分钟 -> "昨天 09:15"
  // 3. 前天：前天 小时:分钟 -> "前天 18:30"
  // 4. 同年跨月：月-日 小时:分钟 -> "07月20日 16:00"
  // 5. 不跨月不显示月份：日 小时:分钟 -> "5日 14:30"
  // 6. 跨年：年-月-日 小时:分钟 -> "2025年12月18日 11:00"

  // 按业务类型组织消息数据，每条第信息带站内信分类标题
  const mockData = {
    '设备监控与管理': [
      {
        timeDisplay: '14:20', // 当天直接显示 hh:mm
        category: '围栏告警',
        title: '围栏报警',
        content: '您的“挖掘机”（设备编号：SY123456）驶出了围栏“长沙工业园围栏”（围栏地址：湖南省长沙市经济技术开发区），可点击查看详情。',
        linkText: '查看围栏告警记录列表'
      },
      {
        timeDisplay: '昨天 09:15', // 昨天显示 昨天 hh:mm
        category: '围栏告警',
        title: '围栏报警',
        content: '您的“压路机”（设备编号：SY888888）驶入了围栏“三一重工2号厂区”，可点击查看详情。',
        linkText: '查看围栏告警记录列表'
      },
      {
        timeDisplay: '前天 18:30', // 前天显示 前天 hh:mm
        category: '围栏告警',
        title: '围栏报警',
        content: '您的“起重机”（设备编号：SY666666）驶出了围栏“上海配送中心”，可点击查看详情。',
        linkText: '查看围栏告警记录列表'
      },
      {
        timeDisplay: '07月20日 16:00', // 同年跨月显示 月日 hh:mm
        category: '设备绑定消息提醒',
        title: '设备绑定提醒',
        content: '「KT105AXE40164」超期未审核，系统已自动收回临时权限，请联系设备管理员审核。',
        linkText: ''
      },
      {
        timeDisplay: '2025年12月18日 11:00', // 跨年显示 年月日 hh:mm
        category: '围栏告警',
        title: '围栏报警',
        content: '您的“泵车”（设备编号：SY999999）驶出了围栏“北京物流园区”，可点击查看详情。',
        linkText: '查看围栏告警记录列表'
      }
    ],
    '服务与售后': [
      {
        timeDisplay: '09:30', // 当天
        category: '服务召请',
        title: '服务订单状态变更通知',
        content: '工程师【李工】已受理您的设备【SY123456】召请服务。',
        linkText: '查看服务订单进度'
      },
      {
        timeDisplay: '昨天 10:15',
        category: '保养提醒',
        title: '待保养通知',
        content: '您的设备 SY98765432 需要保养了，请预约保养！点击预约保养。',
        linkText: '点击预约保养'
      },
      {
        timeDisplay: '前天 15:20',
        category: '服务召请',
        title: '服务订单状态变更通知',
        content: '您的设备【SY123456】已完成服务，请及时确认电子工单并评价。',
        linkText: '查看服务订单进度'
      },
      {
        timeDisplay: '06月05日 14:00', // 同年跨月
        category: '保养提醒',
        title: '待保养通知',
        content: '您的设备 SY12345678 需要保养了，请预约保养！点击预约保养。',
        linkText: '点击预约保养'
      },
      {
        timeDisplay: '5日 09:00', // 同月不跨月，不显示月份
        category: '服务召请',
        title: '服务订单状态变更通知',
        content: '工程师【王工】已抵达设备【SY555555】现场，正在开始服务。',
        linkText: '查看服务订单进度'
      }
    ],
    '商务与报价': [
      {
        timeDisplay: '08月09日 11:00',
        category: '服务工单',
        title: '服务工单预报价单',
        content: '您收到一份服务工单预报价单，服务工号（8787908530），点击查看。',
        linkText: '查看预报价单'
      },
      {
        timeDisplay: '08月08日 14:20',
        category: '配件报价',
        title: '配件报价单确认',
        content: '您有一笔配件询价需要您确认报价，询价单号（8787908530），点击查看立即确认。',
        linkText: '查看报价单'
      },
      {
        timeDisplay: '07月30日 09:30',
        category: '服务工单',
        title: '服务工单预报价单',
        content: '您收到一份服务工单预报价单，服务工号（8781112223），点击查看。',
        linkText: '查看预报价单'
      },
      {
        timeDisplay: '07月28日 16:40',
        category: '配件报价',
        title: '配件报价单确认',
        content: '您有一笔配件询价需要您确认报价，询价单号（8785566778），点击查看立即确认。',
        linkText: '查看报价单'
      }
    ],
    '客户反馈与评价': [
      {
        timeDisplay: '08月10日 15:00',
        category: '投诉',
        title: '内容回复通知',
        content: '您提交的内容已处理。',
        linkText: '查看内容详情'
      },
      {
        timeDisplay: '08月07日 09:00',
        category: '满意度回访',
        title: '满意度回访',
        content: '尊敬的客户，感谢您选择三一产品，欢迎您参加三一集团满意度调查活动，认证验证码：XXXX，请您在XX小时内点击此链接XXXXXXXXXXXXXXXXXXXX进行评价。',
        linkText: ''
      },
      {
        timeDisplay: '08月05日 10:20',
        category: '投诉',
        title: '内容回复通知',
        content: '您提交的内容已处理。',
        linkText: '查看内容详情'
      }
    ]
  };

  function openDetail(typeName) {
    const app = document.getElementById('app');
    const titleEl = document.getElementById('detail-nav-title');
    const contentEl = document.getElementById('detail-content');

    titleEl.innerText = typeName;

    // 渲染消息卡片与时间分割线
    const list = mockData[typeName] || [];
    let html = '';

    list.forEach(item => {
      html += `
        <div class="time-divider">
          <span>${item.timeDisplay}</span>
        </div>
        <div class="detail-card">
          <div class="detail-card-title">
            ${item.title}
          </div>
          <div class="detail-card-body">${item.content}</div>
          ${item.linkText ? `
            <div class="detail-card-link">
              <span>${item.linkText}</span>
              <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
          ` : ''}
        </div>
      `;
    });

    contentEl.innerHTML = html;
    app.classList.add('show-detail');
  }

  function closeDetail() {
    const app = document.getElementById('app');
    app.classList.remove('show-detail');
  }
</script>

</body>
</html>
